let twitterWidgetsPromise = null;
function loadTwitterWidgets() {
  if (window.twttr && window.twttr.widgets) return Promise.resolve(window.twttr);
  if (twitterWidgetsPromise) return twitterWidgetsPromise;

  twitterWidgetsPromise = new Promise((resolve,reject)=>{
    let script = document.getElementById("twitter-wjs");
    if (!script) {
      script = document.createElement("script");
      script.id = "twitter-wjs";
      script.src = "https://platform.twitter.com/widgets.js";
      script.async = true;
      script.charset = "utf-8";
      document.body.appendChild(script);
    }

    let attempts = 0;
    const waitForWidgets = ()=>{
      if (window.twttr && window.twttr.widgets) {
        resolve(window.twttr);
        return;
      }
      attempts += 1;
      if (attempts >= 40) {
        reject(new Error("X widgets could not be loaded"));
        return;
      }
      window.setTimeout(waitForWidgets,250);
    };
    waitForWidgets();
  }).catch(error=>{
    twitterWidgetsPromise = null;
    throw error;
  });

  return twitterWidgetsPromise;
}

function XPostEmbed() {
  const mountRef = useRef(null);
  const [status,setStatus] = useState("loading");

  useEffect(()=>{
    let cancelled = false;
    setStatus("loading");
    if (mountRef.current) mountRef.current.innerHTML = "";

    loadTwitterWidgets()
      .then(twttr=>{
        if (cancelled || !mountRef.current || !mountRef.current.isConnected) return null;
        return twttr.widgets.createTweet(X_POST_ID,mountRef.current,{
          theme:"dark",align:"center",conversation:"none",cards:"visible",dnt:true,lang:"ja"
        });
      })
      .then(element=>{
        if (!cancelled) setStatus(element ? "loaded" : "failed");
      })
      .catch(()=>{
        if (!cancelled) setStatus("failed");
      });

    return ()=>{ cancelled = true; };
  },[]);

  return (
    <div className="x-embed-shell">
      {status === "loading" && <p className="embed-status" role="status">寮紹介を読み込んでいます…</p>}
      {status === "failed" && <p className="embed-status">埋め込みを表示できませんでした。下のリンクから寮紹介をご覧いただけます。</p>}

  );
}

async function copyShareText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (error) {
      // file:// や権限拒否時は、下の互換コピーへ切り替える。
    }
  }
  const previousFocus = document.activeElement;
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly","");
  Object.assign(textarea.style,{position:"fixed",inset:"0 auto auto 0",opacity:"0",pointerEvents:"none"});
  document.body.appendChild(textarea);
  let copied = false;
  try {
    textarea.focus();
    textarea.select();
    copied = Boolean(document.execCommand && document.execCommand("copy"));
  } catch (error) {
  } finally {
    textarea.remove();
    if (previousFocus && previousFocus.isConnected && typeof previousFocus.focus === "function") previousFocus.focus();
  }
  return copied;
}

function buildSignalCounts(answerChoices) {
  return answerChoices.reduce((counts,choice,questionIndex)=>{
    const tags = ANSWER_TAGS[questionIndex] && ANSWER_TAGS[questionIndex][choice];
    (tags || []).forEach(tag=>{ counts[tag]=(counts[tag]||0)+1; });
    return counts;
  },{});
}

function topReasonLabels(entries,counts) {
  return entries
    .map(([tag,weight])=>({tag,value:(counts[tag]||0)*weight}))
    .filter(item=>item.value>0)
    .sort((a,b)=>b.value-a.value || a.tag.localeCompare(b.tag))
    .slice(0,3)
    .map(item=>TAG_LABELS[item.tag] || item.tag);
}

function buildPlayerProfile(counts) {
  const rankedArchetypes = PLAYER_ARCHETYPES.map(archetype=>({
    archetype,
    score:archetype.tags.reduce((total,tag)=>total+(counts[tag]||0),0),
  })).sort((a,b)=>b.score-a.score || a.archetype.id.localeCompare(b.archetype.id));
  const primary = rankedArchetypes[0].archetype;
  const secondary = rankedArchetypes[1].archetype;
  const traits = Object.entries(counts)
    .sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))
    .slice(0,5)
    .map(([tag])=>TAG_LABELS[tag] || tag);
  return {
    title:primary.title,
    summary:`${primary.summary} ${secondary.nuance}`,
    strength:primary.strength,
    caution:primary.caution,
    traits,
  };
}

function buildPersonaMatches(answerChoices,dormScores) {
  const counts = buildSignalCounts(answerChoices);
  const maxDorm = Math.max(1,...Object.values(dormScores));
  const ranked = CHARACTERS.map(profile=>{
    const signalScore = Object.entries(profile.signals)
      .reduce((total,[tag,weight])=>total+(counts[tag]||0)*weight,0);
    const dormFit = profile.dorm == null ? 0 : ((dormScores[profile.dorm]||0)/maxDorm)*7;
    return {profile,score:signalScore+dormFit};
  }).sort((a,b)=>b.score-a.score || a.profile.name.localeCompare(b.profile.name,"ja"));

  const similar = ranked[0].profile;
  const compatible = CHARACTERS
    .filter(profile=>profile.id!==similar.id)
    .map(profile=>{
      const complement = profile.compatibleWith.reduce((total,tag)=>total+(counts[tag]||0)*2.5,0);
      const resonance = Object.entries(profile.signals)
        .reduce((total,[tag,weight])=>total+(counts[tag]||0)*weight*.16,0);
      const freshPerspective = profile.dorm == null || profile.dorm!==similar.dorm ? 1.2 : .4;
      return {profile,score:complement+resonance+freshPerspective};
    })
    .sort((a,b)=>b.score-a.score || a.profile.name.localeCompare(b.profile.name,"ja"))[0].profile;

  const similarityReasons = topReasonLabels(Object.entries(similar.signals),counts);
  const compatibilityReasons = topReasonLabels(compatible.compatibleWith.map(tag=>[tag,1]),counts);
  const playerProfile = buildPlayerProfile(counts);
  return {similar,compatible,similarityReasons,compatibilityReasons,playerProfile,counts};
}

  const stopBgm = ()=>{
    const audio=bgmRef.current;
    if(audio){
      audio.pause();
      audio.currentTime=0;
    }
    setBgmPlaying(false);
    setBgmStatus("");
  };

  const toggleBgm = async()=>{
    const audio=bgmRef.current;
    if(!audio) return;
    setBgmStatus("");
    if(!audio.paused){
      stopBgm();
      return;
    }
    audio.volume=0.3;
    audio.currentTime=0;

      await audio.play();
      setBgmPlaying(true);

      setBgmPlaying(false);

              <p style={{fontSize:14,lineHeight:2,color:"#a89b87",margin:"0 auto 8px"}}>
                もしあなたがこの学院へ招かれたなら、<br/>武力・知識・政治・芸術──どの思想を選ぶのか。</p>
              <p style={{fontSize:13,color:"#7a6f60",lineHeight:1.8}}>全18問から、あなたの所属寮と性格傾向を読み解き、<br/>学院の29人物から「近い人物」と「相性の良い人物」を導きます。</p>
            </div>

            <div className="intro-dorm-grid">
              {Object.values(DORMS).map((d,i)=>(
                <div key={i} className="intro-dorm-card" style={{border:`1px solid ${d.color}55`,
                  background:`linear-gradient(135deg,${d.color}16,transparent)`}}>
                  <div style={{fontSize:20,marginBottom:3,color:d.accent}}>{d.icon}</div>
                  <div style={{fontSize:13,fontWeight:700,color:d.accent}}>{d.name}</div>
                  <div className="cinzel" style={{fontSize:9,letterSpacing:2,color:"#8a7d6b"}}>{d.latin}</div>
                  <div style={{fontSize:11,color:"#7a6f60",marginTop:2}}>{d.subtitle}</div>
                </div>
              ))}
            </div>
            <button className="intro-start-button" onClick={start} style={goldBtn({padding:"12px 24px",color:"#e6cc93",background:"linear-gradient(135deg,rgba(18,14,10,0.94),rgba(45,34,20,0.94))",border:"1px solid #c4a265",boxShadow:"inset 0 0 0 1px rgba(243,234,212,0.08)",animation:"pulseGlow 3s ease-in-out infinite"})}>
              <span style={{display:"block",fontFamily:"'Noto Serif JP',serif",fontSize:17,letterSpacing:2}}>診断をはじめる</span>
              <span className="cinzel" style={{display:"block",marginTop:3,fontSize:9,letterSpacing:4}}>START DIAGNOSIS</span>
            </button>

            <section className="dorm-chronicles" data-media="x" aria-labelledby="dorm-chronicles-title">
              <div className="cinzel media-eyebrow">DORM CHRONICLES</div>
              <h3 id="dorm-chronicles-title" className="media-title">寮の記録</h3>
              <p className="dorm-chronicles-copy">コラボメンバーの一人による投稿です。4つの寮の概要と、コラボ参加メンバーを紹介しています。</p>
              <XPostEmbed />
            </section>
          </div>
        )}

        {/* QUIZ */}
        {phase==="quiz" && (
          <div>
            <div style={{marginBottom:30}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span className="cinzel" style={{fontSize:11,color:"#7a6f60",letterSpacing:2}}>QUESTION</span>
                <span style={{fontSize:13,color:"#b8a88a",fontWeight:700}}>{current+1}<span style={{color:"#5a5244",fontWeight:400}}> / {QUESTIONS.length}</span></span>
              </div>
              <div style={{height:2,background:"#1f1d18",borderRadius:1,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${((current+1)/QUESTIONS.length)*100}%`,background:"linear-gradient(90deg,#c4a265,#f3ead4)",transition:"width .55s ease"}} />
              </div>
            </div>
            <h2 style={{fontSize:18,fontWeight:700,lineHeight:1.7,marginBottom:26,color:"#f3ead4"}}>{QUESTIONS[current].question}</h2>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {QUESTIONS[current].options.map((opt,idx)=>{
                const sel=selected===idx;
                return (
                  <button key={idx} onClick={()=>answer(opt,idx)} style={{
                    padding:"15px 18px",fontSize:14,lineHeight:1.6,color:sel?"#f3ead4":"#c4b89a",textAlign:"left",
                    background:sel?"rgba(196,162,101,0.16)":"rgba(255,255,255,0.03)",
                    border:sel?"1px solid rgba(196,162,101,0.55)":"1px solid rgba(255,255,255,0.07)",
                    borderRadius:8,transition:"all .3s ease",opacity:selected!==null&&!sel?0.35:1,transform:sel?"scale(1.01)":"scale(1)"}}>
                    <span className="cinzel" style={{color:"#7a6a50",marginRight:10,fontSize:12}}>{String.fromCharCode(65+idx)}</span>{opt.t}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* RESULT */}
        {phase==="result" && D && persona && (
          <div>
            <div style={{textAlign:"center"}}>
              <div className="cinzel" style={{fontSize:12,letterSpacing:4,color:"#7a6f60",marginBottom:16}}>SORTING RESULT</div>
              <div style={{fontSize:50,marginBottom:8,color:D.accent,animation:"fadeIn .8s ease both"}}>{D.icon}</div>
              <h1 style={{fontSize:30,fontWeight:900,color:D.accent,marginBottom:2,animation:"fadeIn .8s ease .2s both"}}>{D.name}</h1>
              <div className="cinzel" style={{fontSize:13,letterSpacing:4,color:"#8a7d6b",marginBottom:8,animation:"fadeIn .8s ease .3s both"}}>{D.latin}</div>
              <div style={{fontSize:13,color:D.accent,marginBottom:18,animation:"fadeIn .8s ease .35s both"}}>あなたの所属寮 ・ {D.subtitle}</div>

              {bgmTrack && (
                <div style={{margin:"0 auto 20px",animation:"fadeIn .8s ease .38s both"}}>
                  <audio ref={bgmRef} src={bgmTrack.src} loop preload="none"
                    onPlay={()=>setBgmPlaying(true)} onPause={()=>setBgmPlaying(false)}
                    onError={()=>{setBgmPlaying(false);setBgmStatus("BGMを読み込めませんでした。音声ファイルをご確認ください。");}} />
                  <button type="button" onClick={toggleBgm} aria-pressed={bgmPlaying}
                    aria-label={`${bgmTrack.title}のBGMを${bgmPlaying?"停止":"再生"}`}
                    style={{minWidth:156,padding:"10px 20px",fontSize:13,fontWeight:700,letterSpacing:2,
                      color:bgmPlaying?"#0a0a12":D.accent,
                      background:bgmPlaying?`linear-gradient(135deg,${D.accent},${D.color})`:"rgba(0,0,0,0.2)",
                      border:`1px solid ${D.color}99`,borderRadius:999}}>
                    <span aria-hidden="true">♪</span> {bgmPlaying?"BGM OFF":"BGM ON"}
                  </button>
                  <div style={{fontSize:11,color:"#7a6f60",marginTop:7}}>♪ {bgmTrack.title}</div>
                  <p role="status" aria-live="polite" style={{minHeight:bgmStatus?18:0,fontSize:11,color:D.accent,marginTop:bgmStatus?7:0}}>{bgmStatus}</p>
                </div>
              )}

              <img src={D.sheet} alt={D.name+"設定資料"} style={{width:"100%",borderRadius:10,border:`1px solid ${D.color}66`,
                boxShadow:`0 8px 30px rgba(0,0,0,0.5)`,marginBottom:6,animation:"fadeIn .8s ease .4s both"}} />
              <div style={{fontSize:10,color:"#5a5244",marginBottom:18}}>▲ {D.name} 公式設定資料</div>

              <div style={{padding:"14px 20px",background:"rgba(255,255,255,0.03)",border:`1px solid ${D.color}44`,borderRadius:8,marginBottom:20,animation:"fadeIn .8s ease .5s both"}}>
                <p style={{fontSize:13,fontStyle:"italic",color:"#a89b87",lineHeight:1.8}}>「{D.motto}」</p>
              </div>
              <p style={{fontSize:14,lineHeight:2,color:"#c4b89a",textAlign:"left",marginBottom:8,animation:"fadeIn .8s ease .55s both"}}>{D.desc}</p>
            </div>

            <PlayerProfile profile={persona.playerProfile} accent={D.accent} border={D.color} />

            {persona && (
              <section style={{marginTop:12,animation:"slideUp .6s ease .6s both"}}>
                <Divider color={D.color} />
                <div className="cinzel" style={{textAlign:"center",fontSize:12,color:D.accent,marginBottom:7}}>PERSONA RESONANCE</div>
                <p style={{textAlign:"center",fontSize:12,color:"#7a6f60",lineHeight:1.7,marginBottom:16}}>
                  同じ答えから、「似ている人物」と「関係が育ちやすい人物」を別々に判定しました。
                </p>
                <div className="persona-grid">
                  <PersonaCard label="あなたに最も近い人物" profile={persona.similar} reasons={persona.similarityReasons} mode="similar" />
                  <PersonaCard label="あなたと相性の良い人物" profile={persona.compatible} reasons={persona.compatibilityReasons} mode="compatible" />
                </div>
              </section>
            )}

            <div style={{textAlign:"center"}}>
              <button onClick={()=>setShowScore(!showScore)} style={{background:"none",border:"none",color:"#7a6f60",fontSize:13,margin:"8px 0",padding:"8px 16px"}}>
                {showScore?"▲ スコア詳細を閉じる":"▼ 寮ごとの適性スコアを見る"}
              </button>
              {showScore && sorted && (
                <div style={{marginBottom:8,animation:"slideUp .4s ease both",textAlign:"left"}}>
                  {sorted.map(([key,score],i)=>{
                    const d=DORMS[key]; const pct=Math.round((score/(dormMax[key]||1))*100);
                    return (
                      <div key={key} style={{marginBottom:12}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <span style={{fontSize:13,color:i===0?d.accent:"#7a6f60"}}>{d.icon} {d.name}</span>
                          <span style={{fontSize:12,color:"#5a5244"}}>{score}pt ({pct}%)</span>
                        </div>
                        <div style={{height:6,background:"#1a1a14",borderRadius:3,overflow:"hidden"}}>
                          <div style={{height:"100%",width:pct+"%",background:i===0?`linear-gradient(90deg,${d.color},${d.accent})`:"#3a362e",borderRadius:3,animation:"expandBar 1s ease both",animationDelay:`${i*.15}s`}} />
                        </div>
                      </div>
                    );
                  })}
                  <p style={{fontSize:11,color:"#5a5244",marginTop:8,lineHeight:1.6}}>※ 1位と2位が僅差なら、あなたは両方の寮の気質を強く併せ持っています。</p>
                </div>
              )}
            </div>

            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginTop:16}}>
              <button type="button" onClick={shareResult} style={{padding:"13px 26px",minWidth:190,fontSize:14,fontWeight:700,color:"#0a0a12",background:`linear-gradient(135deg,${D.accent},${D.color})`,border:"none",borderRadius:6,letterSpacing:1}}>この結果をシェア</button>
              <button type="button" onClick={reset} style={{padding:"13px 26px",fontSize:14,fontWeight:700,color:D.accent,background:"rgba(0,0,0,0.16)",border:`1px solid ${D.color}88`,borderRadius:6,letterSpacing:1}}>最初から診断</button>
            </div>
            <p id="share-status" role="status" aria-live="polite" style={{minHeight:20,textAlign:"center",fontSize:12,color:D.accent,marginTop:10}}>{shareStatus}</p>
            <p style={{textAlign:"center",fontSize:11,color:"#5a5244",marginTop:22,lineHeight:1.7}}>
              この診断は、回答に表れた価値観や行動傾向を<br/>レガリア王立魔術学院の世界観に重ねたものです。
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

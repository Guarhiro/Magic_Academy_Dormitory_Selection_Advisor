function buildSignalCounts(answerChoices) {
  return answerChoices.reduce((counts,choice,questionIndex)=>{
    const tags = ANSWER_TAGS[questionIndex] && ANSWER_TAGS[questionIndex][choice];
    (tags || []).forEach(tag=>{ counts[tag]=(counts[tag]||0)+1; });
    return counts;
  },{});
}

function topReasonLabels(entries,counts) {
  return entries
    .map(([tag,weight])=>({tag,value:(counts[tag]||0)*weight}))
    .filter(item=>item.value>0)
    .sort((a,b)=>b.value-a.value || a.tag.localeCompare(b.tag))
    .slice(0,3)
    .map(item=>TAG_LABELS[item.tag] || item.tag);
}

function buildPersonaMatches(answerChoices,dormScores) {
  const counts = buildSignalCounts(answerChoices);
  const maxDorm = Math.max(1,...Object.values(dormScores));
  const ranked = CHARACTERS.map(profile=>{
    const signalScore = Object.entries(profile.signals)
      .reduce((total,[tag,weight])=>total+(counts[tag]||0)*weight,0);
    const dormFit = profile.dorm==="all" ? 3.5 : ((dormScores[profile.dorm]||0)/maxDorm)*7;
    return {profile,score:signalScore+dormFit};
  }).sort((a,b)=>b.score-a.score || a.profile.name.localeCompare(b.profile.name,"ja"));

  const similar = ranked[0].profile;
  const compatible = CHARACTERS
    .filter(profile=>profile.id!==similar.id)
    .map(profile=>{
      const complement = profile.compatibleWith.reduce((total,tag)=>total+(counts[tag]||0)*2.5,0);
      const resonance = Object.entries(profile.signals)
        .reduce((total,[tag,weight])=>total+(counts[tag]||0)*weight*.16,0);
      const freshPerspective = profile.dorm==="all" || profile.dorm!==similar.dorm ? 1.2 : .4;
      return {profile,score:complement+resonance+freshPerspective};
    })
    .sort((a,b)=>b.score-a.score || a.profile.name.localeCompare(b.profile.name,"ja"))[0].profile;

  const similarityReasons = topReasonLabels(Object.entries(similar.signals),counts);
  const compatibilityReasons = topReasonLabels(compatible.compatibleWith.map(tag=>[tag,1]),counts);
  return {similar,compatible,similarityReasons,compatibilityReasons,counts};
}

function buildCharacter(primary, secondary, flags, grade) {
  const k = KIT[primary];
  const speechKey = flags.speech && SPEECH[flags.speech] ? flags.speech : primary;
  const sp = SPEECH[speechKey];
  const m = pick(k.magic);
  const gradeObj = GRADES.find(g=>g.id===grade) || GRADES[1];
  const rivalry = RIVALRY[primary][secondary] || "";
  const hybrid = secondary && secondary!==primary
    ? `${DORMS[primary].name}を軸にしつつ、${DORMS[secondary].name}の気質（${DORMS[secondary].traits[0]}・${DORMS[secondary].traits[1]}）も併せ持つ二面性が個性になる。`
    : `${DORMS[primary].name}の気質が極端に振り切れた、寮の象徴のような純粋なキャラ。`;
  const social = flags.social==="introvert" ? "人付き合いは狭く深く。基本は単独行動だが、心を許した相手には脆い一面を見せる。"
    : flags.social==="extrovert" ? "誰とでもすぐ打ち解ける。常に人の輪の中心にいるタイプ。" : "";
  const romance = ({
    awkward:"恋愛になると途端にポンコツ化。好きな人の前で挙動不審になるギャップが萌え要素。",
    uninterested:"恋愛に一切興味がない。だからこそ落ちたときの破壊力が物語になる。",
    calculating:"恋愛すら戦略の一部として計算する。だが本物の感情に出会ったとき仮面が崩れる。",
    passionate:"恋に全身全霊。一目惚れも修羅場も全力。感情のジェットコースターが魅力。",
  })[flags.romance] || "";
  const chrono = ({
    morning:"早朝型。規律正しい生活が性格に表れている。",
    night:"夜型。日中は気だるげだが、夜になると豹変する二面性。",
    irregular:"生活リズムは気分次第。掴みどころのなさが魅力。",
  })[flags.chrono] || "";
  return {
    archetype:pick(k.archetype), strength:pick(k.strength), flaw:pick(k.flaw),
    magicSchool:m.school, magicTrigger:m.trigger, visual:pick(k.visual), haunt:pick(k.haunt),
    speechP:sp.p, speechLine:sp.line, grade:gradeObj, rivalry, hybrid,
    extra:[social,romance,chrono].filter(Boolean),
  };
}

                boxShadow:`0 8px 30px rgba(0,0,0,0.5)`,marginBottom:6,animation:"fadeIn .8s ease .4s both"}} />
              <div style={{fontSize:10,color:"#5a5244",marginBottom:18}}>▲ {D.name} 公式設定資料</div>

              <div style={{padding:"14px 20px",background:"rgba(255,255,255,0.03)",border:`1px solid ${D.color}44`,borderRadius:8,marginBottom:20,animation:"fadeIn .8s ease .5s both"}}>
                <p style={{fontSize:13,fontStyle:"italic",color:"#a89b87",lineHeight:1.8}}>「{D.motto}」</p>
              </div>
              <p style={{fontSize:14,lineHeight:2,color:"#c4b89a",textAlign:"left",marginBottom:8,animation:"fadeIn .8s ease .55s both"}}>{D.desc}</p>
            </div>

            {persona && (
              <section style={{marginTop:12,animation:"slideUp .6s ease .6s both"}}>
                <Divider color={D.color} />
                <div className="cinzel" style={{textAlign:"center",fontSize:12,color:D.accent,marginBottom:7}}>PERSONA RESONANCE</div>
                <p style={{textAlign:"center",fontSize:12,color:"#7a6f60",lineHeight:1.7,marginBottom:16}}>
                  同じ答えから、「似ている人物」と「関係が育ちやすい人物」を別々に判定しました。
                </p>
                <div className="persona-grid">
                  <PersonaCard label="あなたに最も近い人物" profile={persona.similar} reasons={persona.similarityReasons} mode="similar" />
                  <PersonaCard label="あなたと相性の良い人物" profile={persona.compatible} reasons={persona.compatibilityReasons} mode="compatible" />
                </div>
              </section>
            )}

            <div style={{marginTop:10,animation:"slideUp .6s ease .6s both"}}>
              <Divider color={D.color} />
              <div className="cinzel" style={{textAlign:"center",fontSize:12,letterSpacing:3,color:D.accent,marginBottom:14}}>CHARACTER STARTER KIT</div>

              {[
                ["アーキタイプ（役割）",character.archetype],
                ["性格の核（長所）",character.strength],
                ["性格の核（弱点）",character.flaw],
                ["魔法系統",character.magicSchool],
                ["魔法の発動トリガー",character.magicTrigger],
                ["一人称",character.speechP],
                ["口調サンプル",character.speechLine],
                ["ビジュアル方向性",character.visual],
                ["行きつけの場所",character.haunt],
                ["学年・立ち位置",character.grade.hook],
                ["二面性のヒント（2位の寮）",character.hybrid],
                ["他寮との因縁フック",character.rivalry],
              ].map(([label,val],i)=> val ? (
                <div key={i} style={{marginBottom:11,padding:"12px 16px",background:"rgba(255,255,255,0.025)",borderLeft:`2px solid ${D.color}aa`,borderRadius:"0 6px 6px 0"}}>
                  <div style={{fontSize:11,letterSpacing:1,color:D.accent,marginBottom:5}}>{label}</div>
                  <div style={{fontSize:14,lineHeight:1.7,color:"#d8ccb4"}}>{val}</div>
                </div>
              ) : null)}

              {character.extra.length>0 && (
                <div style={{marginBottom:11,padding:"12px 16px",background:"rgba(255,255,255,0.025)",borderLeft:`2px solid ${D.color}aa`,borderRadius:"0 6px 6px 0"}}>
                  <div style={{fontSize:11,letterSpacing:1,color:D.accent,marginBottom:5}}>回答から拾った追加の個性</div>
                  {character.extra.map((e,j)=>(<div key={j} style={{fontSize:14,lineHeight:1.7,color:"#d8ccb4",marginTop:j?6:0}}>・{e}</div>))}
                </div>
              )}

              <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",margin:"18px 0 6px"}}>
                {D.traits.map(t=>(
                  <span key={t} style={{padding:"5px 14px",fontSize:12,color:D.accent,background:`${D.color}1e`,border:`1px solid ${D.color}44`,borderRadius:20}}>{t}</span>
                ))}
              </div>
            </div>

            <div style={{textAlign:"center"}}>
              <button onClick={()=>setShowScore(!showScore)} style={{background:"none",border:"none",color:"#7a6f60",fontSize:13,margin:"8px 0",padding:"8px 16px"}}>
                {showScore?"▲ スコア詳細を閉じる":"▼ 寮ごとの適性スコアを見る"}
              </button>
              {showScore && sorted && (
                <div style={{marginBottom:8,animation:"slideUp .4s ease both",textAlign:"left"}}>
                  {sorted.map(([key,score],i)=>{
                    const d=DORMS[key]; const pct=Math.round((score/(dormMax[key]||1))*100);
                    return (
                      <div key={key} style={{marginBottom:12}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <span style={{fontSize:13,color:i===0?d.accent:"#7a6f60"}}>{d.icon} {d.name}</span>
                          <span style={{fontSize:12,color:"#5a5244"}}>{score}pt ({pct}%)</span>
                        </div>
                        <div style={{height:6,background:"#1a1a14",borderRadius:3,overflow:"hidden"}}>
                          <div style={{height:"100%",width:pct+"%",background:i===0?`linear-gradient(90deg,${d.color},${d.accent})`:"#3a362e",borderRadius:3,animation:"expandBar 1s ease both",animationDelay:`${i*.15}s`}} />
                        </div>
                      </div>
                    );
                  })}
                  <p style={{fontSize:11,color:"#5a5244",marginTop:8,lineHeight:1.6}}>※ 1位と2位が僅差なら、両寮の気質を併せ持つ「ハイブリッドなキャラ」として深みを出せます。</p>
                </div>
              )}
            </div>

            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginTop:16}}>
              <button onClick={reroll} style={{padding:"13px 26px",fontSize:14,fontWeight:700,color:D.accent,background:"transparent",border:`1px solid ${D.accent}99`,borderRadius:6,letterSpacing:1}}>スターターキットを再生成</button>
              <button onClick={reset} style={{padding:"13px 26px",fontSize:14,fontWeight:700,color:"#0a0a12",background:`linear-gradient(135deg,${D.accent},${D.color})`,border:"none",borderRadius:6,letterSpacing:1}}>最初から診断</button>
            </div>
            <p style={{textAlign:"center",fontSize:11,color:"#5a5244",marginTop:22,lineHeight:1.7}}>
              人物診断は回答に表れた気質をもとにした創作上の指針です。<br/>気に入った要素を拾い、自由にキャラを育ててください。
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

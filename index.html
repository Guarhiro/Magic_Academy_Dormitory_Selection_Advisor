/* 他寮との因縁テンプレ */
const RIVALRY = {
  makina:  { corvus:"理屈っぽいコルウス寮生に「考えすぎだ」と突っかかるが、いざという時の知略には密かに頼る。", medicis:"お上品なメディシス寮の建前が気に食わず突っかかる。だが治療では世話になる腐れ縁。", lumiere:"ノリの良さでルミエール寮と意気投合。お祭り騒ぎの共犯者。" },
  corvus:  { makina:"脳筋なマキナ寮を「非効率」と見下しつつ、その純粋な熱さに分析対象以上の何かを感じ始める。", medicis:"情報を巡ってメディシス寮と腹の探り合い。利害が一致すれば最強のタッグ。", lumiere:"感性で動くルミエール寮を理解不能としつつ、その作品にだけは妙に惹かれる。" },
  medicis: { makina:"単純なマキナ寮を「使いやすい駒」と内心評価しつつ、その裏表のなさに毒気を抜かれる。", corvus:"危険なコルウス寮の知識を欲し、近づく。互いに利用し合う危うい関係。", lumiere:"派手なルミエール寮を表向き嗜めつつ、その影響力を政治利用しようと画策。" },
  lumiere: { makina:"熱血なマキナ寮を「最高のミューズ」と気に入り振り回す。", corvus:"陰気なコルウス寮にこそ「隠れた美」を見出し、無理やり舞台に引っ張り出す。", medicis:"完璧なメディシス寮の仮面を「つまらない」と剥がしにかかる天敵。" },
};

/* ─────────────── ユーティリティ ─────────────── */
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const StarField = () => {
  const stars = React.useMemo(() => Array.from({length:60}, (_,i)=>({
    id:i, x:Math.random()*100, y:Math.random()*100,
    size:Math.random()*2+0.5, delay:Math.random()*4, dur:Math.random()*3+2,
  })), []);
  return (
    <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}}>
      {stars.map(s=>(
        <div key={s.id} style={{position:"absolute",left:s.x+"%",top:s.y+"%",
          width:s.size,height:s.size,borderRadius:"50%",background:"rgba(255,255,255,0.6)",
          animation:`twinkle ${s.dur}s ease-in-out ${s.delay}s infinite alternate`}} />
      ))}
    </div>
  );
};

/* ─────────────── キャラ生成ロジック ─────────────── */
function buildCharacter(primary, secondary, flags, grade) {
  const k = KIT[primary];
  const speechKey = flags.speech && SPEECH[flags.speech] ? flags.speech : primary;
  const sp = SPEECH[speechKey];
  const m = pick(k.magic);
  const gradeObj = GRADES.find(g => g.id === grade) || GRADES[1];
  const rivalry = RIVALRY[primary][secondary] || "";

  const hybrid = secondary && secondary !== primary
    ? `${DORMS[primary].name}を軸にしつつ、${DORMS[secondary].name}の気質（${DORMS[secondary].traits[0]}・${DORMS[secondary].traits[1]}）も併せ持つ二面性が個性になる。`
    : `${DORMS[primary].name}の気質が極端に振り切れた、寮の象徴のような純粋なキャラ。`;

  const social = flags.social === "introvert" ? "人付き合いは狭く深く。基本は単独行動だが、心を許した相手には脆い一面を見せる。"
    : flags.social === "extrovert" ? "誰とでもすぐ打ち解ける。常に人の輪の中心にいるタイプ。"
    : "";
  const romance = ({
    awkward:"恋愛になると途端にポンコツ化。好きな人の前で挙動不審になるギャップが萌え要素。",
    uninterested:"恋愛に一切興味がない。だからこそ落ちたときの破壊力が物語になる。",
    calculating:"恋愛すら戦略の一部として計算する。だが本物の感情に出会ったとき仮面が崩れる。",
    passionate:"恋に全身全霊。一目惚れも修羅場も全力。感情のジェットコースターが魅力。",
  })[flags.romance] || "";
  const chrono = ({
    morning:"早朝型。規律正しい生活が性格に表れている。",
    night:"夜型。日中は気だるげだが夜になると豹変する二面性。",
    irregular:"生活リズムは気分次第。掴みどころのなさが魅力。",
  })[flags.chrono] || "";

  return {
    archetype: pick(k.archetype),
    strength: pick(k.strength),
    flaw: pick(k.flaw),
    magicSchool: m.school,
    magicTrigger: m.trigger,
    visual: pick(k.visual),
    speechP: sp.p,
    speechLine: sp.line,
    grade: gradeObj,
    rivalry,
    hybrid,
    extra: [social, romance, chrono].filter(Boolean),
  };
}

/* ─────────────── メインアプリ ─────────────── */
function App() {
  const [phase, setPhase] = useState("intro"); // intro, quiz, grade, result
  const [current, setCurrent] = useState(0);
  const [scores, setScores] = useState({makina:0,corvus:0,medicis:0,lumiere:0});
  const [flags, setFlags] = useState({});
  const [selected, setSelected] = useState(null);
  const [fade, setFade] = useState("in");
  const [sorted, setSorted] = useState(null);
  const [grade, setGrade] = useState(2);
  const [character, setCharacter] = useState(null);
  const [showScore, setShowScore] = useState(false);

  const transition = (fn, delay=450) => {
    setFade("out");
    setTimeout(()=>{ fn(); setFade("in"); }, delay);
  };

  const start = () => transition(()=>setPhase("quiz"), 500);

  const answer = (opt, idx) => {
    if (selected !== null) return;
    setSelected(idx);
    const ns = {...scores};
    Object.entries(opt.s||{}).forEach(([k,v])=> ns[k]+=v);
    setScores(ns);
    const nf = {...flags};
    if (opt.f) Object.entries(opt.f).forEach(([k,v])=> nf[k]=v);
    setFlags(nf);

    setTimeout(()=>{
      if (current < QUESTIONS.length-1) {
        transition(()=>{ setCurrent(c=>c+1); setSelected(null); }, 380);
      } else {
        const sortedArr = Object.entries(ns).sort((a,b)=>b[1]-a[1]);
        setSorted(sortedArr);
        transition(()=>{ setPhase("grade"); setSelected(null); }, 550);
      }
    }, 550);
  };

  const confirmGrade = () => {
    const primary = sorted[0][0];
    const secondary = sorted[1][0];
    setCharacter(buildCharacter(primary, secondary, flags, grade));
    transition(()=>setPhase("result"), 500);
  };

  const reroll = () => {
    const primary = sorted[0][0];
    const secondary = sorted[1][0];
    setCharacter(buildCharacter(primary, secondary, flags, grade));
  };

  const reset = () => transition(()=>{
    setPhase("intro"); setCurrent(0);
    setScores({makina:0,corvus:0,medicis:0,lumiere:0});
    setFlags({}); setSelected(null); setSorted(null);
    setGrade(2); setCharacter(null); setShowScore(false);
  }, 500);

  const primaryDorm = sorted ? DORMS[sorted[0][0]] : null;
  const bg = primaryDorm && (phase==="result"||phase==="grade") ? primaryDorm.bg
    : "linear-gradient(135deg,#0a0a12 0%,#12121f 50%,#0a0a12 100%)";
  const maxPossible = 36;

  const wrap = {
    position:"relative", zIndex:1, maxWidth:660, margin:"0 auto", padding:"40px 20px",
    opacity: fade==="in"?1:0, transform: fade==="in"?"translateY(0)":"translateY(12px)",
    transition:"opacity .4s ease, transform .4s ease",
  };
  const goldBtn = (extra={}) => ({
    display:"block", margin:"0 auto", padding:"14px 44px", fontSize:15, fontWeight:700,
    color:"#0a0a12", background:"linear-gradient(135deg,#f0e6d2,#c4a265)",
    border:"none", borderRadius:6, letterSpacing:3, ...extra,
  });

  return (
    <div style={{minHeight:"100vh", background:bg, color:"#e8e0d4", position:"relative",
      overflow:"hidden", transition:"background 1s ease"}}>
      <StarField />
      <div style={wrap}>

        {/* INTRO */}
        {phase==="intro" && (
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,letterSpacing:6,color:"#8a7d6b",textTransform:"uppercase",marginBottom:16}}>Regalia Royal Academy of Magic</div>
            <h1 style={{fontSize:28,fontWeight:900,lineHeight:1.4,marginBottom:8,
              background:"linear-gradient(180deg,#f0e6d2,#c4a265)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
              レガリア王立魔術学院</h1>
            <h2 style={{fontSize:17,fontWeight:400,color:"#b8a88a",marginBottom:28}}>寮分け＆キャラクター生成診断</h2>
            <div style={{width:1,height:44,background:"linear-gradient(180deg,transparent,#c4a265,transparent)",margin:"0 auto 28px"}} />
            <p style={{fontSize:14,lineHeight:2,color:"#a89b87",maxWidth:480,margin:"0 auto 8px"}}>
              あなたが創ろうとしているキャラクターは、<br/>どの寮にふさわしいか──？</p>
            <p style={{fontSize:13,color:"#7a6f60",marginBottom:32}}>全16問に答えると、寮の判定に加えて<br/>キャラクター設定の「スターターキット」を生成します。</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,maxWidth:420,margin:"0 auto 36px"}}>
              {Object.values(DORMS).map((d,i)=>(
                <div key={i} style={{padding:"14px 12px",border:`1px solid ${d.color}44`,borderRadius:8,background:`${d.color}0d`,textAlign:"center"}}>
                  <div style={{fontSize:22,marginBottom:4}}>{d.icon}</div>
                  <div style={{fontSize:13,fontWeight:700,color:d.accent}}>{d.name}</div>
                  <div style={{fontSize:11,color:"#7a6f60"}}>{d.subtitle}</div>
                </div>
              ))}
            </div>
            <button onClick={start} style={goldBtn({animation:"pulseGlow 3s ease-in-out infinite"})}>診 断 開 始</button>
          </div>
        )}

        {/* QUIZ */}
        {phase==="quiz" && (
          <div>
            <div style={{marginBottom:30}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:11,color:"#7a6f60",letterSpacing:2}}>QUESTION</span>
                <span style={{fontSize:13,color:"#b8a88a",fontWeight:700}}>{current+1}<span style={{color:"#5a5244",fontWeight:400}}> / {QUESTIONS.length}</span></span>
              </div>
              <div style={{height:2,background:"#1f1d18",borderRadius:1,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${((current+1)/QUESTIONS.length)*100}%`,background:"linear-gradient(90deg,#c4a265,#f0e6d2)",transition:"width .55s ease"}} />
              </div>
            </div>
            <h2 style={{fontSize:18,fontWeight:700,lineHeight:1.7,marginBottom:26,color:"#f0e6d2"}}>{QUESTIONS[current].question}</h2>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {QUESTIONS[current].options.map((opt,idx)=>{
                const sel = selected===idx;
                return (
                  <button key={idx} onClick={()=>answer(opt,idx)} style={{
                    padding:"15px 18px",fontSize:14,lineHeight:1.6,
                    color:sel?"#f0e6d2":"#c4b89a",textAlign:"left",
                    background:sel?"rgba(196,162,101,0.15)":"rgba(255,255,255,0.03)",
                    border:sel?"1px solid rgba(196,162,101,0.5)":"1px solid rgba(255,255,255,0.06)",
                    borderRadius:8,transition:"all .3s ease",
                    opacity:selected!==null&&!sel?0.35:1, transform:sel?"scale(1.01)":"scale(1)"}}>
                    <span style={{color:"#7a6a50",marginRight:10,fontSize:12}}>{String.fromCharCode(65+idx)}.</span>{opt.t}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* GRADE SELECT */}
        {phase==="grade" && primaryDorm && (
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:12,letterSpacing:4,color:"#7a6f60",marginBottom:14}}>STEP 2 / 学年を選択</div>
            <div style={{fontSize:40,marginBottom:6}}>{primaryDorm.icon}</div>
            <p style={{fontSize:14,color:"#b8a88a",marginBottom:6}}>所属は <span style={{color:primaryDorm.accent,fontWeight:700}}>{primaryDorm.name}</span> に決定。</p>
            <p style={{fontSize:13,color:"#7a6f60",marginBottom:26}}>このキャラは何年生？ 立ち位置がキャラ設定に反映されます。</p>
            <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:28}}>
              {GRADES.map(g=>{
                const sel = grade===g.id;
                return (
                  <button key={g.id} onClick={()=>setGrade(g.id)} style={{
                    padding:"14px 18px",textAlign:"left",borderRadius:8,transition:"all .25s ease",
                    background:sel?`${primaryDorm.color}22`:"rgba(255,255,255,0.03)",
                    border:sel?`1px solid ${primaryDorm.accent}88`:"1px solid rgba(255,255,255,0.06)"}}>
                    <div style={{fontSize:15,fontWeight:700,color:sel?primaryDorm.accent:"#c4b89a",marginBottom:3}}>{g.label}</div>
                    <div style={{fontSize:12,color:"#8a7d6b",lineHeight:1.6}}>{g.hint}</div>
                  </button>
                );
              })}
            </div>
            <button onClick={confirmGrade} style={goldBtn()}>キャラ案を生成する</button>
          </div>
        )}

        {/* RESULT */}
        {phase==="result" && primaryDorm && character && (
          <div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:12,letterSpacing:4,color:"#7a6f60",marginBottom:18}}>SORTING RESULT</div>
              <div style={{fontSize:54,marginBottom:10,animation:"fadeIn .8s ease both"}}>{primaryDorm.icon}</div>
              <h1 style={{fontSize:30,fontWeight:900,color:primaryDorm.accent,marginBottom:4,animation:"fadeIn .8s ease .2s both"}}>{primaryDorm.name}</h1>
              <div style={{fontSize:14,color:"#8a7d6b",letterSpacing:2,marginBottom:8,animation:"fadeIn .8s ease .3s both"}}>── {primaryDorm.subtitle} ──</div>
              <div style={{fontSize:13,color:character.grade?primaryDorm.accent:"#8a7d6b",marginBottom:22,animation:"fadeIn .8s ease .35s both"}}>{character.grade.label}</div>
              <div style={{padding:"14px 20px",background:"rgba(255,255,255,0.03)",border:`1px solid ${primaryDorm.color}33`,borderRadius:8,marginBottom:22,animation:"fadeIn .8s ease .4s both"}}>
                <p style={{fontSize:13,fontStyle:"italic",color:"#a89b87",lineHeight:1.8}}>「{primaryDorm.motto}」</p>
              </div>
              <p style={{fontSize:14,lineHeight:2,color:"#c4b89a",textAlign:"left",marginBottom:18,animation:"fadeIn .8s ease .5s both"}}>{primaryDorm.desc}</p>
            </div>

            {/* CHARACTER KIT */}
            <div style={{marginTop:14,padding:"4px 0",animation:"slideUp .6s ease .6s both"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0 14px"}}>
                <div style={{flex:1,height:1,background:`linear-gradient(90deg,transparent,${primaryDorm.color}66)`}} />
                <span style={{fontSize:12,letterSpacing:3,color:primaryDorm.accent}}>CHARACTER STARTER KIT</span>
                <div style={{flex:1,height:1,background:`linear-gradient(90deg,${primaryDorm.color}66,transparent)`}} />
              </div>

              {[
                ["アーキタイプ（役割）", character.archetype],
                ["性格の核（長所）", character.strength],
                ["性格の核（弱点）", character.flaw],
                ["魔法系統", character.magicSchool],
                ["魔法の発動トリガー", character.magicTrigger],
                ["一人称", character.speechP],
                ["口調サンプル", character.speechLine],
                ["ビジュアル方向性", character.visual],
                ["学年・立ち位置", character.grade.hook],
                ["二面性のヒント", character.hybrid],
                ["他寮との因縁フック", character.rivalry],
              ].map(([label,val],i)=> val ? (
                <div key={i} style={{marginBottom:12,padding:"12px 16px",background:"rgba(255,255,255,0.025)",borderLeft:`2px solid ${primaryDorm.color}88`,borderRadius:"0 6px 6px 0"}}>
                  <div style={{fontSize:11,letterSpacing:1,color:primaryDorm.accent,marginBottom:5}}>{label}</div>
                  <div style={{fontSize:14,lineHeight:1.7,color:"#d8ccb4"}}>{val}</div>
                </div>
              ) : null)}

              {character.extra.length>0 && (
                <div style={{marginBottom:12,padding:"12px 16px",background:"rgba(255,255,255,0.025)",borderLeft:`2px solid ${primaryDorm.color}88`,borderRadius:"0 6px 6px 0"}}>
                  <div style={{fontSize:11,letterSpacing:1,color:primaryDorm.accent,marginBottom:5}}>回答から拾った追加の個性</div>
                  {character.extra.map((e,j)=>(<div key={j} style={{fontSize:14,lineHeight:1.7,color:"#d8ccb4",marginTop:j?6:0}}>・{e}</div>))}
                </div>
              )}

              <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",margin:"20px 0 8px"}}>
                {primaryDorm.traits.map(t=>(
                  <span key={t} style={{padding:"5px 14px",fontSize:12,color:primaryDorm.accent,background:`${primaryDorm.color}18`,border:`1px solid ${primaryDorm.color}33`,borderRadius:20}}>{t}</span>
                ))}
              </div>
            </div>

            {/* SCORE */}
            <div style={{textAlign:"center"}}>
              <button onClick={()=>setShowScore(!showScore)} style={{background:"none",border:"none",color:"#7a6f60",fontSize:13,margin:"8px 0",padding:"8px 16px"}}>
                {showScore?"▲ スコア詳細を閉じる":"▼ 寮ごとの適性スコアを見る"}
              </button>
              {showScore && sorted && (
                <div style={{marginBottom:8,animation:"slideUp .4s ease both",textAlign:"left"}}>
                  {sorted.map(([key,score],i)=>{
                    const d=DORMS[key]; const pct=Math.round((score/maxPossible)*100);
                    return (
                      <div key={key} style={{marginBottom:12}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <span style={{fontSize:13,color:i===0?d.accent:"#7a6f60"}}>{d.icon} {d.name}</span>
                          <span style={{fontSize:12,color:"#5a5244"}}>{score}pt ({pct}%)</span>
                        </div>
                        <div style={{height:6,background:"#1a1a14",borderRadius:3,overflow:"hidden"}}>
                          <div style={{height:"100%",width:pct+"%",background:i===0?`linear-gradient(90deg,${d.color},${d.accent})`:"#3a362e",borderRadius:3,animation:"expandBar 1s ease both",animationDelay:`${i*.15}s`}} />
                        </div>
                      </div>
                    );
                  })}
                  <p style={{fontSize:11,color:"#5a5244",marginTop:8,lineHeight:1.6}}>※ 1位と2位が僅差なら、両寮の気質を併せ持つ「ハイブリッドなキャラ」として深みを出せます。</p>
                </div>
              )}
            </div>

            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginTop:18}}>
              <button onClick={reroll} style={{padding:"13px 28px",fontSize:14,fontWeight:700,color:primaryDorm.accent,background:"transparent",border:`1px solid ${primaryDorm.accent}88`,borderRadius:6,letterSpacing:1}}>🎲 別のキャラ案を生成</button>
              <button onClick={reset} style={{padding:"13px 28px",fontSize:14,fontWeight:700,color:"#0a0a12",background:`linear-gradient(135deg,${primaryDorm.accent},${primaryDorm.color})`,border:"none",borderRadius:6,letterSpacing:1}}>最初から診断</button>
            </div>
            <p style={{textAlign:"center",fontSize:11,color:"#5a5244",marginTop:24,lineHeight:1.7}}>
              生成された設定はあくまで「種」です。<br/>気に入った要素を拾い、自由にアレンジしてキャラを育ててください。
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
